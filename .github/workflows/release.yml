name: release

# Un tag v* publie la release Windows (zip portable et installateur).
# Lancé à la main, il vérifie seulement que tout se construit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions figées par SHA : un tag déplacé ne peut pas changer ce qui
      # tourne ici avec le droit de publier une release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Le jeton n'est pas laissé dans .git/config pour les étapes
          # suivantes ; le dépôt est public, le fetch du tag s'en passe.
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version de pubspec.yaml"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Versions et empreintes exactes de pubspec.lock, sinon échec.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Installateur
        run: |
          choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} "/O$PWD\dist" windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip portable
        run: |
          $release = 'build\windows\x64\runner\Release'
          New-Item -ItemType File "$release\portable" | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\couchplay-${{ steps.version.outputs.version }}-windows-portable.zip"

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le checkout ne garde pas le message du tag annoté : les notes en viennent.
          git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName --title "CouchPlay $env:GITHUB_REF_NAME" --notes-from-tag
