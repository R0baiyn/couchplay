name: release

# Un tag v* publie la release : Windows (zip portable et installateur) et
# Android (un APK par architecture). Lancé à la main, il construit tout sans
# rien publier ; les fichiers restent un jour dans les artefacts du run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Lecture seule partout ; seul le job release peut publier.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions figées par SHA : un tag déplacé ne peut pas changer ce qui
      # tourne ici.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Le jeton n'est pas laissé dans .git/config pour les étapes
          # suivantes ; le dépôt est public, le fetch du tag s'en passe.
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "Version introuvable dans pubspec.yaml"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # Versions et empreintes exactes de pubspec.lock, sinon échec.
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Installateur
        run: |
          choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION "/O$PWD\dist" windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip portable
        run: |
          $release = 'build\windows\x64\runner\Release'
          New-Item -ItemType File "$release\portable" | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\couchplay-$env:VERSION-windows-portable.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error
          retention-days: 1

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Gradle n'installe pas le NDK tout seul : celui de Flutter 3.47.8
      # (flutter.ndkVersion), installé s'il manque au runner. L'outil peut
      # dire « not found » et réussir quand même : le dossier fait foi.
      - name: NDK
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          [ -d "$ndk" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" < /dev/null > /dev/null
          test -d "$ndk"

      # La clé ne vit que le temps du job, hors du dossier du dépôt ; un
      # secret absent fait échouer le build au lieu de signer autrement.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Secrets de signature absents"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/couchplay.jks"
          # Format .properties : une barre oblique inverse s'y écrit doublée.
          pass=${KEYSTORE_PASSWORD//\\/\\\\}
          {
            echo "storeFile=$RUNNER_TEMP/couchplay.jks"
            echo "storePassword=$pass"
            echo "keyAlias=couchplay"
            echo "keyPassword=$pass"
          } > android/key.properties

      # Un APK par architecture, versionCode 1000 + N (armv7) et 2000 + N
      # (arm64) : ne jamais publier d'APK universel (N), refusé par-dessus.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Effacer la clé
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/couchplay.jks"

      - name: APK
        run: |
          mkdir dist
          apk=build/app/outputs/flutter-apk
          mv "$apk/app-arm64-v8a-release.apk" "dist/couchplay-$VERSION-android-arm64.apk"
          mv "$apk/app-armeabi-v7a-release.apk" "dist/couchplay-$VERSION-android-armv7.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [windows, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le checkout ne garde pas le message du tag annoté : les notes en viennent.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --title "CouchPlay $GITHUB_REF_NAME" --notes-from-tag
